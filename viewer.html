<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Description Theory Viewer</title>
  <style>
    :root {
      --bg: #f3efe4;
      --panel: #fffaf0;
      --panel-2: #f7f1e3;
      --ink: #1f1a17;
      --muted: #6b5e53;
      --line: #d8cdbd;
      --accent: #8a5a2b;
      --accent-soft: #ead9c7;
      --shadow: 0 18px 40px rgba(55, 39, 24, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(214, 185, 139, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(138, 90, 43, 0.12), transparent 22%),
        linear-gradient(180deg, #f7f2e9 0%, var(--bg) 100%);
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 24px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.88);
      backdrop-filter: blur(8px);
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdf8, var(--panel-2));
      box-shadow: var(--shadow);
    }

    .card h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
    }

    .card p,
    .status,
    .meta {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.94rem;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search,
    .button {
      width: 100%;
      border: 1px solid var(--line);
      font: inherit;
    }

    .search {
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
    }

    .button {
      padding: 11px 12px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .button:hover,
    .button:focus-visible,
    .nav-button:hover,
    .nav-button:focus-visible {
      outline: none;
      background: #fff;
      border-color: #bfa78a;
    }

    .nav-group-title {
      margin: 18px 0 8px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .nav-button.active {
      background: var(--accent-soft);
      border-color: #c8ab85;
      color: #4b2d10;
      font-weight: 700;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      transform: translateX(1px);
    }

    main {
      padding: 32px;
      min-width: 0;
    }

    .reader {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 34px 40px;
      border: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.92);
      box-shadow: var(--shadow);
    }

    .reader-header {
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .reader-header h2 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.2vw, 2.2rem);
      line-height: 1.2;
    }

    .meta code,
    .status code,
    .content code {
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      background: #f2e6d8;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }

    .content {
      line-height: 1.72;
      font-size: 1.05rem;
      word-break: break-word;
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4,
    .content h5,
    .content h6 {
      margin: 1.7em 0 0.7em;
      line-height: 1.2;
    }

    .content h1 { font-size: 2rem; }
    .content h2 { font-size: 1.65rem; }
    .content h3 { font-size: 1.35rem; }
    .content p { margin: 0 0 1em; }
    .content ul, .content ol { margin: 0 0 1.1em 1.4em; }
    .content li { margin: 0.28em 0; }

    .content hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.8em 0;
    }

    .content pre {
      overflow-x: auto;
      padding: 14px 16px;
      border-radius: 10px;
      background: #2b2119;
      color: #f7efe6;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .content pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .content blockquote {
      margin: 1.2em 0;
      padding: 0.2em 0 0.2em 1em;
      border-left: 4px solid #c8ab85;
      color: #5b4a39;
    }

    .content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(138, 90, 43, 0.35);
    }

    .content a:hover { border-bottom-color: currentColor; }

    .empty {
      color: var(--muted);
      font-style: italic;
      padding: 1rem 0;
    }

    #folderInput { display: none; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      main { padding: 18px; }
      .reader { padding: 22px 18px 28px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <section class="card">
        <h1>Description Theory Viewer</h1>
        <p>Simple navigation for the Markdown files in this repository.</p>
      </section>

      <section class="toolbar">
        <input id="search" class="search" type="search" placeholder="Filter files..." aria-label="Filter files">
        <button id="chooseFolder" class="button" type="button">Choose repo folder for live loading</button>
        <input id="folderInput" type="file" webkitdirectory multiple>
      </section>

      <div id="nav"></div>
    </aside>

    <main>
      <article class="reader">
        <header class="reader-header">
          <h2 id="title">Loading...</h2>
          <p class="meta">Source: <code id="path"></code></p>
          <p class="status" id="status"></p>
        </header>
        <section id="content" class="content"></section>
      </article>
    </main>
  </div>

  <script>
    const files = [
      { title: "Working Notes", path: "notes.md", group: "Workspace" },
      { title: "Index", path: "Description Theory Index.md", group: "Workspace" },
      { title: "README", path: "README.md", group: "Workspace" },
      { title: "Agent Instructions", path: "AGENTS.md", group: "Workspace" },
      { title: "Abstract", path: "Description Theory Abstract.md", group: "Manuscript" },
      { title: "Chapter 1 - Introduction & Overview", path: "Description Theory Chapter 1 - Introduction & Overview.md", group: "Manuscript" },
      { title: "Chapter 2 - Definitions & Notation", path: "Description Theory Chapter 2 - Definitions & Notation.md", group: "Manuscript" },
      { title: "Chapter 3 - Flow & Thinks", path: "Description Theory Chapter 3 - Flow & Thinks.md", group: "Manuscript" },
      { title: "Chapter 4 - Space, Tone, Hue, Saturation, Images", path: "Description Theory Chapter 4  - Space, Tone, Hue, Saturation, Images.md", group: "Manuscript" },
      { title: "Chapter 5 - Self & Consciousness", path: "Description Theory Chapter 5 - Self & Consciousness.md", group: "Manuscript" },
      { title: "Chapter 6 - Reality", path: "Description Theory Chapter 6 - Reality.md", group: "Manuscript" },
      { title: "Chapter 7 - Probability", path: "Description Theory Chapter 7 - Probability.md", group: "Manuscript" },
      { title: "Chapter 8 - Quantum Model", path: "Description theory Chapter 8 - Quantum Model.md", group: "Manuscript" },
      { title: "Chapter 9", path: "Description Theory Chapter 9.md", group: "Manuscript" },
      { title: "Chapter 10", path: "Description Theory Chapter 10.md", group: "Manuscript" },
      { title: "Archive - Chapter 9 Alternative Draft", path: "archive/Chapter 9 - alternative draft.md", group: "Archive" }
    ];

    const nav = document.getElementById("nav");
    const search = document.getElementById("search");
    const chooseFolder = document.getElementById("chooseFolder");
    const folderInput = document.getElementById("folderInput");
    const titleEl = document.getElementById("title");
    const pathEl = document.getElementById("path");
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("content");
    const fileMap = new Map();

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function applyInlineMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      html = html.replace(/\[\[([^\]]+)\]\]/g, (match, target) => {
        const normalized = target.trim();
        const found = files.find(file => file.path === normalized || file.path === normalized + ".md");
        if (!found) return "<code>" + escapeHtml(match) + "</code>";
        return '<a href="#" data-path="' + encodeURIComponent(found.path) + '">' + escapeHtml(normalized) + "</a>";
      });
      return html;
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let inCode = false;
      let codeLines = [];
      let listType = null;
      let paragraph = [];

      function closeParagraph() {
        if (paragraph.length) {
          html += "<p>" + applyInlineMarkdown(paragraph.join(" ")) + "</p>";
          paragraph = [];
        }
      }

      function closeList() {
        if (listType) {
          html += listType === "ol" ? "</ol>" : "</ul>";
          listType = null;
        }
      }

      function closeCode() {
        if (inCode) {
          html += "<pre><code>" + escapeHtml(codeLines.join("\n")) + "</code></pre>";
          inCode = false;
          codeLines = [];
        }
      }

      for (const line of lines) {
        if (line.startsWith("```")) {
          closeParagraph();
          closeList();
          if (inCode) {
            closeCode();
          } else {
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        const trimmed = line.trim();
        if (!trimmed) {
          closeParagraph();
          closeList();
          continue;
        }

        if (/^---+$/.test(trimmed)) {
          closeParagraph();
          closeList();
          html += "<hr>";
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          closeParagraph();
          closeList();
          const level = heading[1].length;
          html += "<h" + level + ">" + applyInlineMarkdown(heading[2]) + "</h" + level + ">";
          continue;
        }

        const quote = trimmed.match(/^>\s?(.*)$/);
        if (quote) {
          closeParagraph();
          closeList();
          html += "<blockquote><p>" + applyInlineMarkdown(quote[1]) + "</p></blockquote>";
          continue;
        }

        const ordered = trimmed.match(/^\d+\.\s+(.*)$/);
        if (ordered) {
          closeParagraph();
          if (listType !== "ol") {
            closeList();
            listType = "ol";
            html += "<ol>";
          }
          html += "<li>" + applyInlineMarkdown(ordered[1]) + "</li>";
          continue;
        }

        const unordered = trimmed.match(/^[-*]\s+(.*)$/);
        if (unordered) {
          closeParagraph();
          if (listType !== "ul") {
            closeList();
            listType = "ul";
            html += "<ul>";
          }
          html += "<li>" + applyInlineMarkdown(unordered[1]) + "</li>";
          continue;
        }

        closeList();
        paragraph.push(trimmed);
      }

      closeParagraph();
      closeList();
      closeCode();
      return html || '<p class="empty">No content available.</p>';
    }

    async function loadMarkdown(path) {
      if (fileMap.has(path)) {
        return { text: await fileMap.get(path).text(), source: "selected folder" };
      }

      try {
        const response = await fetch(encodeURI(path), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        return { text: await response.text(), source: "repository file" };
      } catch (error) {
        throw new Error("Could not load file. If you opened this HTML directly, click 'Choose repo folder for live loading'.");
      }
    }

    async function showFile(path) {
      const file = files.find(item => item.path === path) || files[0];
      titleEl.textContent = file.title;
      pathEl.textContent = file.path;

      try {
        const result = await loadMarkdown(file.path);
        statusEl.innerHTML = "Viewing from <code>" + result.source + "</code>.";
        contentEl.innerHTML = renderMarkdown(result.text);
      } catch (error) {
        statusEl.textContent = error.message;
        contentEl.innerHTML = '<p class="empty">Select the repository folder, or serve this folder with a local web server, then open a file from the left.</p>';
      }

      localStorage.setItem("dt-viewer-current", file.path);
      document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.toggle("active", button.dataset.path === file.path);
      });

      contentEl.querySelectorAll("a[data-path]").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          showFile(decodeURIComponent(link.dataset.path));
        });
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function buildNav(filter = "") {
      const needle = filter.trim().toLowerCase();
      nav.innerHTML = "";

      for (const groupName of ["Workspace", "Manuscript", "Archive"]) {
        const items = files.filter(item => item.group === groupName && (!needle || item.title.toLowerCase().includes(needle) || item.path.toLowerCase().includes(needle)));
        if (!items.length) continue;

        const label = document.createElement("div");
        label.className = "nav-group-title";
        label.textContent = groupName;
        nav.appendChild(label);

        const list = document.createElement("div");
        list.className = "nav-list";

        for (const item of items) {
          const button = document.createElement("button");
          button.className = "nav-button";
          button.type = "button";
          button.textContent = item.title;
          button.dataset.path = item.path;
          button.addEventListener("click", () => showFile(item.path));
          list.appendChild(button);
        }

        nav.appendChild(list);
      }
    }

    chooseFolder.addEventListener("click", () => folderInput.click());

    folderInput.addEventListener("change", event => {
      fileMap.clear();
      for (const file of event.target.files) {
        const relativePath = (file.webkitRelativePath || file.name).replace(/^[^/]+\//, "");
        fileMap.set(relativePath, file);
      }

      const current = localStorage.getItem("dt-viewer-current") || "Description Theory Index.md";
      showFile(current);
    });

    search.addEventListener("input", () => buildNav(search.value));

    buildNav();
    showFile(localStorage.getItem("dt-viewer-current") || "Description Theory Index.md");
  </script>
</body>
</html>
